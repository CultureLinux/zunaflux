name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate publication version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VALIDATE_ONLY: 1
          LC_ALL: C
        run: awk -f .github/scripts/release-tags.awk </dev/null

  quality:
    needs: validate-version
    uses: ./.github/workflows/ci.yml

  detect-docker:
    needs: validate-version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dockerfile: ${{ steps.detect.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if test -f Dockerfile; then
            echo 'dockerfile=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerfile=false' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs:
      - validate-version
      - quality
      - detect-docker
    if: ${{ needs.detect-docker.outputs.dockerfile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Serialize the complete alias calculation/build/push critical section.
    concurrency:
      group: publish-docker-clinuxfr-zunaflux
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Prepare release tags
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          LC_ALL: C
        run: |
          # Validate again before using a ref in output or contacting the registry.
          RELEASE_VALIDATE_ONLY=1 awk -f .github/scripts/release-tags.awk </dev/null
          git ls-remote --tags origin > "$RUNNER_TEMP/release-refs"
          # Handle both lightweight and annotated tags; reject moved/deleted refs.
          awk '
            $2 == "refs/tags/" ENVIRON["RELEASE_TAG"] { direct = $1 }
            $2 == "refs/tags/" ENVIRON["RELEASE_TAG"] "^{}" { peeled = $1 }
            END {
              actual = (peeled != "" ? peeled : direct)
              if (actual != ENVIRON["RELEASE_SHA"]) {
                print "Release tag is missing or no longer points to the event commit." > "/dev/stderr"
                exit 1
              }
            }
          ' "$RUNNER_TEMP/release-refs"
          awk '$2 !~ /\^\{\}$/ { sub(/^refs\/tags\//, "", $2); print $2 }' \
            "$RUNNER_TEMP/release-refs" > "$RUNNER_TEMP/release-inventory"
          awk -f .github/scripts/release-tags.awk \
            "$RUNNER_TEMP/release-inventory" > "$RUNNER_TEMP/release-tags"
          {
            echo 'tags<<RELEASE_TAGS'
            sed 's/^/type=raw,value=/' "$RUNNER_TEMP/release-tags"
            echo 'RELEASE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: clinuxfr/zunaflux
          # Never let metadata-action add an implicit latest alias.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Supply-chain evidence published next to the image.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
