name: CI

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-24.04
        services:
            mariadb:
                image: mariadb:10.11
                env:
                    MARIADB_DATABASE: zunaflux_test
                    MARIADB_USER: zunaflux_test
                    MARIADB_PASSWORD: zunaflux_test
                    MARIADB_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: ctype, iconv, mbstring, pdo_mysql, xml, dom, curl, intl
                  coverage: none
            - uses: ramsey/composer-install@v3
            - name: Validate Composer manifest
              run: composer validate --strict
            - name: Check PHP syntax
              run: find src tests migrations public bin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            - name: Validate Symfony configuration
              run: php bin/console lint:container
            - name: Apply test migrations
              env:
                  APP_ENV: test
                  DATABASE_URL: mysql://zunaflux_test:zunaflux_test@127.0.0.1:3306/zunaflux_test?serverVersion=mariadb-10.11.0&charset=utf8mb4
              run: php bin/console doctrine:migrations:migrate --no-interaction
            - name: Run tests
              env:
                  APP_ENV: test
                  DATABASE_URL: mysql://zunaflux_test:zunaflux_test@127.0.0.1:3306/zunaflux_test?serverVersion=mariadb-10.11.0&charset=utf8mb4
              run: php bin/phpunit
            - name: Build styles
              run: php bin/console tailwind:build --minify
