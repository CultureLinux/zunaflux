name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

# Only superseded PR runs are cancelled; tag publications use unique groups.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      APP_SECRET: ci-test-secret
      APP_TIMEZONE: Europe/Paris
      DATABASE_URL: mysql://zunaflux_test:zunaflux_test@127.0.0.1:3306/zunaflux_test?serverVersion=mariadb-10.11.0&charset=utf8mb4
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      ZUNAFLUX_PAGE_SIZE: 30
      ZUNAFLUX_MAX_SUBSCRIPTIONS: 100
      ZUNAFLUX_PUBLIC_REGISTRATION: 1
      ZUNAFLUX_MEDIA_STORAGE: var/media
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: zunaflux_test
          MARIADB_USER: zunaflux_test
          MARIADB_PASSWORD: zunaflux_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, mbstring, pdo_mysql, xml, dom, curl, intl
          coverage: none
      - name: Configure PHP command paths
        run: |
          sudo ln -sf "$(command -v php)" /usr/local/bin/php85
          if [ "$(command -v composer)" != /usr/bin/composer ]; then
            sudo ln -sf "$(command -v composer)" /usr/bin/composer
          fi
      - name: Prepare Symfony test environment
        run: touch .env
      - name: Install Composer dependencies
        run: php85 /usr/bin/composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer manifest
        run: php85 /usr/bin/composer validate --strict
      - name: Check PHP syntax
        run: find src tests migrations public bin -type f -name '*.php' -print0 | xargs -0 -n1 php85 -l
      - name: Validate Symfony configuration
        run: |
          php85 bin/console lint:container
          php85 bin/console lint:twig templates/
      - name: Apply test migrations
        env:
          APP_ENV: test
          DATABASE_URL: mysql://zunaflux_test:zunaflux_test@127.0.0.1:3306/zunaflux_test?serverVersion=mariadb-10.11.0&charset=utf8mb4
        run: php85 bin/console doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        env:
          APP_ENV: test
          DATABASE_URL: mysql://zunaflux_test:zunaflux_test@127.0.0.1:3306/zunaflux_test?serverVersion=mariadb-10.11.0&charset=utf8mb4
        run: php85 vendor/bin/phpunit --log-junit var/reports/phpunit.xml
      - name: Preserve PHPUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/reports/phpunit.xml
          if-no-files-found: warn
          retention-days: 7

  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check workflow contracts
        run: |
          sh tests/Container/ci-config.sh
          sh tests/Container/workflow-config.sh
          sh tests/Container/publish-workflow-config.sh
          sh tests/Container/ci-quality-gate.sh
      - name: Run JavaScript tests
        run: |
          result=0
          for test_file in tests/JavaScript/*.test.cjs; do
            node "$test_file" || result=1
          done
          exit "$result"

  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: prod
      APP_SECRET: ci-build-secret
      APP_DEBUG: 0
      APP_TIMEZONE: Europe/Paris
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      ZUNAFLUX_PAGE_SIZE: 30
      ZUNAFLUX_MAX_SUBSCRIPTIONS: 100
      ZUNAFLUX_PUBLIC_REGISTRATION: 0
      ZUNAFLUX_MEDIA_STORAGE: var/media
      DATABASE_URL: mysql://unused:unused@127.0.0.1:3306/unused?serverVersion=mariadb-10.11.0&charset=utf8mb4
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, mbstring, pdo_mysql, xml, dom, curl, intl
          coverage: none
      - name: Configure PHP command paths
        run: |
          sudo ln -sf "$(command -v php)" /usr/local/bin/php85
          if [ "$(command -v composer)" != /usr/bin/composer ]; then
            sudo ln -sf "$(command -v composer)" /usr/bin/composer
          fi
      - name: Prepare Symfony build environment
        run: touch .env
      - name: Install Composer dependencies
        run: php85 /usr/bin/composer install --no-interaction --prefer-dist --no-progress
      - name: Build production frontend assets
        run: |
          php85 bin/console tailwind:build --minify --env=prod
          php85 bin/console asset-map:compile --env=prod

  detect-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        run: |
          if test -f Dockerfile && test -f tests/Container/docker-image-smoke.sh && test -f tests/Container/compose-config.sh; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    needs: detect-docker
    if: ${{ needs.detect-docker.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build production image without publishing
        run: docker build --tag clinuxfr/zunaflux:ci-${{ github.sha }} .
      - name: Verify image and Compose topology
        run: |
          sh tests/Container/docker-image-smoke.sh clinuxfr/zunaflux:ci-${{ github.sha }}
          sh tests/Container/compose-config.sh
      - name: Test HTTP server and Compose startup
        run: sh tests/Container/compose-smoke.sh ci-${{ github.sha }}

  quality:
    if: ${{ always() }}
    needs: [php, javascript, assets, detect-docker, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all mandatory validations
        env:
          PHP_RESULT: ${{ needs.php.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          ASSETS_RESULT: ${{ needs.assets.result }}
          DETECT_RESULT: ${{ needs.detect-docker.result }}
          DOCKER_ENABLED: ${{ needs.detect-docker.outputs.enabled }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
        run: |
          test "$PHP_RESULT" = success
          test "$JAVASCRIPT_RESULT" = success
          test "$ASSETS_RESULT" = success
          test "$DETECT_RESULT" = success
          if [ "$DOCKER_ENABLED" = true ]; then
            test "$DOCKER_RESULT" = success
          else
            test "$DOCKER_ENABLED" = false
            test "$DOCKER_RESULT" = skipped
          fi
