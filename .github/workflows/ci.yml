name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_call:

permissions:
  contents: read

# Only superseded PR runs are cancelled; tag publications use unique groups.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      APP_SECRET: ci-test-secret
      APP_TIMEZONE: Europe/Paris
      DATABASE_URL: mysql://zunaflux_test:zunaflux_test@127.0.0.1:3306/zunaflux_test?serverVersion=mariadb-10.11.0&charset=utf8mb4
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      ZUNAFLUX_PAGE_SIZE: 30
      ZUNAFLUX_MAX_SUBSCRIPTIONS: 100
      ZUNAFLUX_PUBLIC_REGISTRATION: 1
      ZUNAFLUX_MEDIA_STORAGE: var/media
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: zunaflux_test
          MARIADB_USER: zunaflux_test
          MARIADB_PASSWORD: zunaflux_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, mbstring, pdo_mysql, xml, dom, curl, intl
          coverage: none
      - name: Configure PHP command paths
        run: |
          sudo ln -sf "$(command -v php)" /usr/local/bin/php85
          if [ "$(command -v composer)" != /usr/bin/composer ]; then
            sudo ln -sf "$(command -v composer)" /usr/bin/composer
          fi
      - name: Prepare Symfony test environment
        run: touch .env
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(php85 /usr/bin/composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install Composer dependencies
        run: php85 /usr/bin/composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer manifest
        run: php85 /usr/bin/composer validate --strict
      - name: Audit locked dependencies
        run: php85 /usr/bin/composer audit --locked
      - name: Check PHP syntax
        run: find src tests migrations public bin -type f -name '*.php' -print0 | xargs -0 -n1 php85 -l
      - name: Analyse src with PHPStan
        run: php85 vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --memory-limit=1G
      - name: Check code style with PHP-CS-Fixer
        run: php85 vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Validate Symfony configuration
        run: |
          php85 bin/console lint:container
          php85 bin/console lint:twig templates/
      - name: Apply test migrations
        env:
          APP_ENV: test
          DATABASE_URL: mysql://zunaflux_test:zunaflux_test@127.0.0.1:3306/zunaflux_test?serverVersion=mariadb-10.11.0&charset=utf8mb4
        run: php85 bin/console doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        env:
          APP_ENV: test
          DATABASE_URL: mysql://zunaflux_test:zunaflux_test@127.0.0.1:3306/zunaflux_test?serverVersion=mariadb-10.11.0&charset=utf8mb4
        run: php85 vendor/bin/phpunit --log-junit var/reports/phpunit.xml
      - name: Preserve PHPUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/reports/phpunit.xml
          if-no-files-found: warn
          retention-days: 7

  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check workflow contracts
        run: |
          sh tests/Container/ci-config.sh
          sh tests/Container/workflow-config.sh
          sh tests/Container/publish-workflow-config.sh
          sh tests/Container/ci-quality-gate.sh
          sh tests/Container/release-tags.sh
          sh tests/Container/release-workflow.sh
      - name: Run JavaScript tests
        run: |
          result=0
          for test_file in tests/JavaScript/*.test.cjs; do
            node "$test_file" || result=1
          done
          exit "$result"

  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: prod
      APP_SECRET: ci-build-secret
      APP_DEBUG: 0
      APP_TIMEZONE: Europe/Paris
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      ZUNAFLUX_PAGE_SIZE: 30
      ZUNAFLUX_MAX_SUBSCRIPTIONS: 100
      ZUNAFLUX_PUBLIC_REGISTRATION: 0
      ZUNAFLUX_MEDIA_STORAGE: var/media
      DATABASE_URL: mysql://unused:unused@127.0.0.1:3306/unused?serverVersion=mariadb-10.11.0&charset=utf8mb4
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, mbstring, pdo_mysql, xml, dom, curl, intl
          coverage: none
      - name: Configure PHP command paths
        run: |
          sudo ln -sf "$(command -v php)" /usr/local/bin/php85
          if [ "$(command -v composer)" != /usr/bin/composer ]; then
            sudo ln -sf "$(command -v composer)" /usr/bin/composer
          fi
      - name: Prepare Symfony build environment
        run: touch .env
      - name: Install Composer dependencies
        run: php85 /usr/bin/composer install --no-interaction --prefer-dist --no-progress
      - name: Build production frontend assets
        run: |
          php85 bin/console tailwind:build --minify --env=prod
          php85 bin/console asset-map:compile --env=prod

  detect-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if test -f Dockerfile && test -f tests/Container/docker-image-smoke.sh && test -f tests/Container/compose-config.sh; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    needs: detect-docker
    if: ${{ needs.detect-docker.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Configure PHP for the restoration exercise
        run: sudo ln -sf "$(command -v php)" /usr/local/bin/php85
      - name: Verify restoration refusal paths without Docker resources
        run: sh tests/Container/restoration-preflight.sh
      - name: Build production image without publishing
        run: docker build --tag clinuxfr/zunaflux:ci-${{ github.sha }} .
      - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clinuxfr/zunaflux:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          # A CVE without an upstream fix must not block the project: only fixable ones fail.
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify image and Compose topology
        run: |
          sh tests/Container/docker-image-smoke.sh clinuxfr/zunaflux:ci-${{ github.sha }}
          sh tests/Container/compose-config.sh
          sh tests/Container/compose-private-config.sh
      - name: Test HTTP server and Compose startup
        run: sh tests/Container/compose-smoke.sh ci-${{ github.sha }}
      - name: Test isolated restore and rollback
        run: sh tests/Restoration/run.sh clinuxfr/zunaflux:ci-${{ github.sha }}
      - name: Preserve restoration report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: restoration-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/restoration/
          if-no-files-found: warn
          retention-days: 7

  migrations:
    strategy:
      fail-fast: false
      matrix:
        scenario: [empty, upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      APP_SECRET: ci-test-secret
      APP_TIMEZONE: Europe/Paris
      MIGRATION_TEST_DATABASE_URL: mysql://zunaflux_migrations_test_ci:zunaflux_migrations_test_ci@127.0.0.1:3306/zunaflux_migrations_test_ci?serverVersion=mariadb-10.11.0&charset=utf8mb4
      DATABASE_URL: mysql://zunaflux_migrations_test_ci:zunaflux_migrations_test_ci@127.0.0.1:3306/zunaflux_migrations_test_ci?serverVersion=mariadb-10.11.0&charset=utf8mb4
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      ZUNAFLUX_PAGE_SIZE: 30
      ZUNAFLUX_MAX_SUBSCRIPTIONS: 100
      ZUNAFLUX_PUBLIC_REGISTRATION: 1
      ZUNAFLUX_MEDIA_STORAGE: var/media
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: zunaflux_migrations_test_ci
          MARIADB_USER: zunaflux_migrations_test_ci
          MARIADB_PASSWORD: zunaflux_migrations_test_ci
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, mbstring, pdo_mysql, xml, dom, curl, intl
          coverage: none
      - name: Configure PHP command paths
        run: |
          sudo ln -sf "$(command -v php)" /usr/local/bin/php85
          if [ "$(command -v composer)" != /usr/bin/composer ]; then
            sudo ln -sf "$(command -v composer)" /usr/bin/composer
          fi
      - name: Prepare Symfony test environment
        run: touch .env
      - name: Install Composer dependencies
        run: php85 /usr/bin/composer install --no-interaction --prefer-dist --no-progress
      - name: Verify isolated migration path
        env:
          MIGRATION_SCENARIO: ${{ matrix.scenario }}
        run: |
          php85 tests/Migration/check-migrations.php "$MIGRATION_SCENARIO"
          # Reusing a populated schema must fail before any new migration attempt.
          if php85 tests/Migration/check-migrations.php "$MIGRATION_SCENARIO" > "$RUNNER_TEMP/migration-reuse.log" 2>&1; then
            echo 'A populated migration test database was unexpectedly accepted.' >&2
            exit 1
          fi
          grep -Fq 'Migration test database must be empty' "$RUNNER_TEMP/migration-reuse.log"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: browser
      APP_SECRET: ci-test-secret
      APP_TIMEZONE: Europe/Paris
      BROWSER_TEST_DATABASE_URL: mysql://zunaflux_browser_test_ci:zunaflux_browser_test_ci@127.0.0.1:3306/zunaflux_browser_test_ci?serverVersion=mariadb-10.11.0&charset=utf8mb4
      DATABASE_URL: mysql://zunaflux_browser_test_ci:zunaflux_browser_test_ci@127.0.0.1:3306/zunaflux_browser_test_ci?serverVersion=mariadb-10.11.0&charset=utf8mb4
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      ZUNAFLUX_PAGE_SIZE: 30
      ZUNAFLUX_MAX_SUBSCRIPTIONS: 100
      ZUNAFLUX_PUBLIC_REGISTRATION: 1
      ZUNAFLUX_MEDIA_STORAGE: var/media
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: zunaflux_browser_test_ci
          MARIADB_USER: zunaflux_browser_test_ci
          MARIADB_PASSWORD: zunaflux_browser_test_ci
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, mbstring, pdo_mysql, xml, dom, curl, intl
          coverage: none
      - name: Configure PHP command paths
        run: |
          sudo ln -sf "$(command -v php)" /usr/local/bin/php85
          if [ "$(command -v composer)" != /usr/bin/composer ]; then
            sudo ln -sf "$(command -v composer)" /usr/bin/composer
          fi
      - name: Prepare Symfony test environment
        run: touch .env
      - name: Install Composer dependencies
        run: php85 /usr/bin/composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and its Linux dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Prepare isolated browser database
        run: |
          php85 tests/Browser/fixtures.php guard
          php85 bin/console doctrine:migrations:migrate --env=browser --no-interaction
          php85 tests/Browser/fixtures.php check
      - name: Build browser frontend assets
        run: |
          php85 bin/console tailwind:build --minify --env=browser
          php85 bin/console asset-map:compile --env=browser
      - name: Run real browser interactions
        run: npm run test:browser
      - name: Preserve browser failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/browser-report/
            var/browser-results/
          if-no-files-found: warn
          retention-days: 7

  quality:
    if: ${{ always() }}
    needs: [php, javascript, assets, migrations, browser, detect-docker, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all mandatory validations
        env:
          PHP_RESULT: ${{ needs.php.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          ASSETS_RESULT: ${{ needs.assets.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DETECT_RESULT: ${{ needs.detect-docker.result }}
          DOCKER_ENABLED: ${{ needs.detect-docker.outputs.enabled }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
        run: |
          test "$PHP_RESULT" = success
          test "$JAVASCRIPT_RESULT" = success
          test "$ASSETS_RESULT" = success
          test "$MIGRATIONS_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$DETECT_RESULT" = success
          if [ "$DOCKER_ENABLED" = true ]; then
            test "$DOCKER_RESULT" = success
          else
            test "$DOCKER_ENABLED" = false
            test "$DOCKER_RESULT" = skipped
          fi
