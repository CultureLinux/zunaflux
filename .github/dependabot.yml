version: 2
updates:
  # Weekly update pull requests only: version bumps stay validated by the maintainer.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Compose files pin the database image by digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # MariaDB 10.11 is the validated target (cahier des charges): only digest/patch refreshes of
    # that line are proposed, never a new major/minor line such as 13.0.
    ignore:
      - dependency-name: mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
