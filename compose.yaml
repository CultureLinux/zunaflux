x-zunaflux-environment: &zunaflux-environment
  APP_ENV: prod
  APP_DEBUG: 0
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET in docker/.env}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in docker/.env}
  MAILER_DSN: ${MAILER_DSN:-null://null}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?queue_name=async}
  ZUNAFLUX_PAGE_SIZE: ${ZUNAFLUX_PAGE_SIZE:-30}
  ZUNAFLUX_MAX_SUBSCRIPTIONS: ${ZUNAFLUX_MAX_SUBSCRIPTIONS:-100}
  ZUNAFLUX_PUBLIC_REGISTRATION: ${ZUNAFLUX_PUBLIC_REGISTRATION:-0}
  ZUNAFLUX_MAX_ACCOUNTS: ${ZUNAFLUX_MAX_ACCOUNTS:-}
  ZUNAFLUX_MEDIA_STORAGE: var/media
  ZUNAFLUX_RETENTION_MONTHS: ${ZUNAFLUX_RETENTION_MONTHS:-12}
  ZUNAFLUX_VAPID_PUBLIC_FILE: ${ZUNAFLUX_VAPID_PUBLIC_FILE:-}
  ZUNAFLUX_VAPID_PRIVATE_FILE: ${ZUNAFLUX_VAPID_PRIVATE_FILE:-}
  ZUNAFLUX_VAPID_SUBJECT: ${ZUNAFLUX_VAPID_SUBJECT:-}
  MATOMO_URL: ${MATOMO_URL:-}
  MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}

services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Set MARIADB_DATABASE in docker/.env}
      MARIADB_USER: ${MARIADB_USER:?Set MARIADB_USER in docker/.env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in docker/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in docker/.env}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    image: clinuxfr/zunaflux:${ZUNAFLUX_IMAGE_TAG:-latest}
    restart: "no"
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--env=prod", "--no-interaction"]
    environment: *zunaflux-environment
    depends_on:
      database:
        condition: service_healthy

  app:
    image: clinuxfr/zunaflux:${ZUNAFLUX_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *zunaflux-environment
    volumes:
      - media-data:/app/var/media
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  assets:
    image: clinuxfr/zunaflux:${ZUNAFLUX_IMAGE_TAG:-latest}
    user: "0:0"
    command: ["/bin/sh", "-ec", "find /public-assets -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a /app/public/. /public-assets/"]
    volumes:
      - public-assets:/public-assets

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${ZUNAFLUX_HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public-assets:/srv/public:ro
    depends_on:
      app:
        condition: service_started
      assets:
        condition: service_completed_successfully

  worker:
    image: clinuxfr/zunaflux:${ZUNAFLUX_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "--env=prod", "--no-interaction", "--time-limit=3600", "--memory-limit=256M", "--failure-limit=10"]
    environment: *zunaflux-environment
    volumes:
      - media-data:/app/var/media
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  collector:
    image: clinuxfr/zunaflux:${ZUNAFLUX_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["/usr/local/bin/collect-feeds"]
    environment:
      <<: *zunaflux-environment
      ZUNAFLUX_COLLECTION_INTERVAL: ${ZUNAFLUX_COLLECTION_INTERVAL:-900}
    volumes:
      - media-data:/app/var/media
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  database-data:
  media-data:
  public-assets:
