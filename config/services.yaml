parameters:
    app.timezone: '%env(APP_TIMEZONE)%'
    app.page_size: '%env(int:ZUNAFLUX_PAGE_SIZE)%'
    app.max_subscriptions: '%env(int:ZUNAFLUX_MAX_SUBSCRIPTIONS)%'
    app.public_registration: '%env(bool:ZUNAFLUX_PUBLIC_REGISTRATION)%'
    app.media_storage: '%env(resolve:ZUNAFLUX_MEDIA_STORAGE)%'
    app.retention_months_default: 12
    app.retention_months: '%env(default:app.retention_months_default:int:ZUNAFLUX_RETENTION_MONTHS)%'
    app.push_empty: ''
    app.push_public_file: '%env(default:app.push_empty:ZUNAFLUX_VAPID_PUBLIC_FILE)%'
    app.push_private_file: '%env(default:app.push_empty:ZUNAFLUX_VAPID_PRIVATE_FILE)%'
    app.push_subject: '%env(default:app.push_empty:ZUNAFLUX_VAPID_SUBJECT)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $publicRegistration: '%app.public_registration%'
            $retentionMonths: '%app.retention_months%'
            $pushPublicFile: '%app.push_public_file%'
            $pushPrivateFile: '%app.push_private_file%'
            $pushSubject: '%app.push_subject%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
