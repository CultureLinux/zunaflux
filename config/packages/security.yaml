security:
    password_hashers:
        App\Entity\User: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: emailNormalized
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/(articles|api/articles), roles: ROLE_USER }
        - { path: ^/subscriptions, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }
