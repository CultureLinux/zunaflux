framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # The table is managed by migrations; avoid DDL inside outbox transactions.
                    auto_setup: false
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
                    jitter: 0.1
            failed:
                dsn: 'doctrine://default?queue_name=failed'
                options:
                    auto_setup: false
        routing:
            'App\Message\CollectFeedMessage': async
            'App\Message\DiscoverFeedMessage': async
            'App\Message\NotifyFeedMessage': async
