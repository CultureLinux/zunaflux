monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50
        nested:
            type: stream
            # stderr by default (visible in `docker compose logs`); set ZUNAFLUX_LOG_PATH to a
            # file path for installations outside Docker.
            path: '%app.log_path%'
            level: warning
            formatter: monolog.formatter.json
        notification:
            type: stream
            path: '%app.log_path%'
            level: info
            channels: ['notification']
            formatter: monolog.formatter.json
