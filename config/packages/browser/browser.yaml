# Dedicated HTTP browser-test environment. Production/test settings are unchanged.
framework:
    session:
        storage_factory_id: session.storage.factory.native
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/browser-sessions'
security:
    password_hashers:
        App\Entity\User:
            algorithm: auto
            cost: 4
            time_cost: 3
            memory_cost: 10
